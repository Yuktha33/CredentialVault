<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | SecureVault</title>
    <link rel="stylesheet" href="../css/user-dashboard.css">
</head>
<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>SecureVault</h2>

        <nav class="sidebar-nav">
            <a href="user-dashboard.html" class="nav-link">
                🏠 Dashboard
            </a>

            <a href="credentials.html" class="nav-link">
                🔑 My Credentials
            </a>

            <a href="password-generator.html" class="nav-link">
                ⚙️ Password Generator
            </a>

            <a href="password-checker.html" class="nav-link">
                🛡️ Password Strength
            </a>

            <a href="breach-detection.html" class="nav-link active">
                🚨 Breach Detection
            </a>

            <a href="shared-credentials.html" class="nav-link">
                🤝 Shared Credentials
            </a>

            <a href="sharing-history.html" class="nav-link">
                📋 Sharing History
            </a>

            <a href="profile-security.html" class="nav-link">
                👤 Profile & Security
            </a>
        </nav>
        <button id="logoutBtn">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header>
            <h1>Password Generator</h1>
            <p>Generate strong and secure passwords for your accounts.</p>
        </header>

        <section class="content-section">

            <div class="generator-card">

                <h2>Generate Secure Password</h2>

                <div class="form-group">
                    <label for="passwordLength">Password Length</label>
                    <input
                            type="number"
                            id="passwordLength"
                            min="4"
                            max="64"
                            value="16"
                    >
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="uppercase" checked>
                        Include Uppercase Letters (A-Z)
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="lowercase" checked>
                        Include Lowercase Letters (a-z)
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="numbers" checked>
                        Include Numbers (0-9)
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="symbols" checked>
                        Include Symbols (!@#$)
                    </label>
                </div>

                <button id="generateBtn">Generate Password</button>

                <div class="form-group">
                    <label for="generatedPassword">Generated Password</label>

                    <input
                            type="text"
                            id="generatedPassword"
                            readonly
                            placeholder="Your password will appear here"
                    >

                    <button id="copyBtn">Copy Password</button>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="../javascript/password-generator.js"></script>
<script src="../javascript/logout.js"></script>
</body>
</html>
