
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Secure Vault</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f6f7fb;
            color: #211e3b;
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #7565e8;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #7565e8;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #6252d5;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #7565e8;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Forgot Password?</h2>

    <p class="description">
        Enter your registered email address.
        We'll send you a link to reset your password.
    </p>

    <form id="forgotPasswordForm">

        <label for="email">Email Address</label>

        <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required
        >

        <button type="submit" id="submitBtn">
            Send Reset Link
        </button>

    </form>

    <p id="message"></p>

    <a href="login.html" class="back-link">
        Back to Login
    </a>

</div>
<script src="../javascript/auth.js"></script>
</body>
</html>
